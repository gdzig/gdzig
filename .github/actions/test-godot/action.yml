name: Test with Godot
description: Run gdzig tests with a specific Godot version

inputs:
  godot-version:
    description: Godot version to test with
    required: true
  cache-key:
    description: Cache key for Zig build artifacts
    required: true
  zig-version:
    description: Zig version to set up (e.g. 'master'). Empty (default) resolves from minimum_zig_version in build.zig.zon.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ inputs.zig-version }}
        cache-key: ${{ inputs.cache-key }}

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        version: ${{ inputs.godot-version }}
        use-dotnet: false

    - name: Run tests
      shell: bash
      run: zig build test -Dgodot-path="$(command -v godot)"
