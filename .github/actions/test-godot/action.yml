name: Test with Godot
description: Run gdzig tests with a specific Godot version

inputs:
  godot-version:
    description: Godot version to test with
    required: true
  cache-key:
    description: Cache key for Zig build artifacts
    required: true

runs:
  using: composite
  steps:
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        cache-key: ${{ inputs.cache-key }}

    - name: Setup mise
      uses: jdx/mise-action@v4
      with:
        install: false

    - name: Install Godot
      shell: bash
      run: mise install godot@${{ inputs.godot-version }}-stable

    - name: Run tests
      shell: bash
      run: mise exec godot@${{ inputs.godot-version }}-stable -- bash -c 'zig build test -Dgodot-path="$(command -v godot)"'
