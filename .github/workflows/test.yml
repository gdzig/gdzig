name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Quick test for PRs - Godot compatibility target on Linux
  test-pr:
    name: Test Godot ${{ matrix.godot }} on ${{ matrix.os }} (zig ${{ matrix.zig }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.zig == 'master' }}
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        godot: ["4.6.3", "4.7.2"]
        zig: ["0.17.0", master]
        target: [native, wasm]
        exclude:
          # wasm is build-only, so one runtime version is sufficient.
          - godot: "4.6.3"
            target: wasm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          cache-key: ${{ matrix.os }}-godot-${{ matrix.godot }}-zig-${{ matrix.zig }}

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false

      - name: Test
        if: matrix.target == 'native'
        run: zig build test -Dgodot-path="$(command -v godot)"

      - name: Build example for wasm32-emscripten
        if: matrix.target == 'wasm'
        run: zig build -Dtarget=wasm32-emscripten
        working-directory: example

  # Full matrix for push to master and manual dispatch
  test-minimum:
    name: Minimum ${{ matrix.pair.minimum }} on Godot ${{ matrix.pair.godot }} (${{ matrix.os }}, Zig ${{ matrix.zig }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.zig == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        zig: ["0.17.0", master]
        pair:
          - {minimum: "4.6", godot: "4.6.3"}
          - {minimum: "4.6", godot: "4.7.2"}
          - {minimum: "4.7", godot: "4.7.2"}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          cache-key: ${{ matrix.os }}-minimum-${{ matrix.pair.minimum }}-godot-${{ matrix.pair.godot }}-zig-${{ matrix.zig }}
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.pair.godot }}
          use-dotnet: false
      - name: Run the full native suite with a compatibility minimum
        run: >-
          zig build test
          -Dgodot_compatibility_minimum=${{ matrix.pair.minimum }}
          -Dgodot-path="$(command -v godot)"
      - name: Verify normal entrypoint registration on matching or newer engines
        run: >-
          zig build test-compatibility-minimum-init
          -Dgodot_compatibility_minimum=${{ matrix.pair.minimum }}
          -Dgodot-path="$(command -v godot)"

  test-minimum-rejection:
    name: Reject minimum 4.7 on Godot 4.6.3 (Zig ${{ matrix.zig }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.zig == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.17.0", master]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          cache-key: minimum-rejection-zig-${{ matrix.zig }}
      - name: Setup older Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.3"
          use-dotnet: false
      - name: Require the floor diagnostic and no registration
        run: >-
          zig build test-compatibility-minimum-init
          -Dgodot_compatibility_minimum=4.7
          -Dgodot-path="$(command -v godot)"

  test-minimum-wasm:
    name: Build wasm minimum ${{ matrix.minimum }} (Zig ${{ matrix.zig }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.zig == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        minimum: ["4.6", "4.7"]
        zig: ["0.17.0", master]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          cache-key: wasm-minimum-${{ matrix.minimum }}-zig-${{ matrix.zig }}
      - name: Setup Godot for build dependency resolution
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.2"
          use-dotnet: false
      - name: Build minimum example for wasm32-emscripten
        working-directory: example
        run: >-
          zig build -Dtarget=wasm32-emscripten
          -Dgodot_compatibility_minimum=${{ matrix.minimum }}

  # Full default matrix for push to master and manual dispatch
  test-full:
    name: Test Godot ${{ matrix.godot }} on ${{ matrix.os }} (zig ${{ matrix.zig }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.zig == 'master' }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Compatibility target on Linux and macOS
        os: [ubuntu-latest]
        godot: ["4.6.3", "4.7.2"]
        zig: ["0.17.0", master]
        target: [native, wasm]
        exclude:
          # wasm is build-only, so one runtime version is sufficient.
          - godot: "4.6.3"
            target: wasm
        include:
          - os: macos-latest
            godot: "4.6.3"
            zig: "0.17.0"
            target: native
          - os: macos-latest
            godot: "4.6.3"
            zig: master
            target: native
          - os: macos-latest
            godot: "4.7.2"
            zig: "0.17.0"
            target: native
          - os: macos-latest
            godot: "4.7.2"
            zig: master
            target: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
          cache-key: ${{ matrix.os }}-godot-${{ matrix.godot }}-zig-${{ matrix.zig }}

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false

      - name: Test
        if: matrix.target == 'native'
        run: zig build test -Dgodot-path="$(command -v godot)"

      - name: Build example for wasm32-emscripten
        if: matrix.target == 'wasm'
        run: zig build -Dtarget=wasm32-emscripten
        working-directory: example
