name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Quick test for PRs - Godot compatibility target on Linux
  test-pr:
    name: Test Godot ${{ matrix.godot }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-latest]
        godot: ["4.7.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/test-godot
        with:
          godot-version: ${{ matrix.godot }}
          cache-key: ${{ matrix.os }}-godot-${{ matrix.godot }}

  # Full matrix for push to master and manual dispatch
  test-full:
    name: Test Godot ${{ matrix.godot }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        # Compatibility target on Linux, macOS, and Windows
        os: [ubuntu-latest]
        godot: ["4.7.2"]
        include:
          - os: macos-latest
            godot: "4.7.2"
          # Temporarily non-blocking while Windows CI is stabilized
          - os: windows-latest
            godot: "4.7.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/test-godot
        with:
          godot-version: ${{ matrix.godot }}
          cache-key: ${{ matrix.os }}-godot-${{ matrix.godot }}
