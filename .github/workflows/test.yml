name: Tests

on:
  push:
    # branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Godot ${{ matrix.godot }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot: "4.5"
            target: x86_64-linux
          - os: ubuntu-latest
            godot: "4.5"
            target: x86_64-windows
            wine: true
          - os: ubuntu-24.04-arm
            godot: "4.5"
            target: aarch64-linux
          - os: ubuntu-24.04-arm
            godot: "4.5"
            target: aarch64-windows
            wine: true

    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - name: Install Wine (x86_64)
        if: matrix.wine && matrix.os == 'ubuntu-latest'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64
      - name: Install Wine (aarch64)
        if: matrix.wine && matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y wine
      - name: Run tests
        run: zig build test -Dgodot-version=${{ matrix.godot }} -Dtarget=${{ matrix.target }} ${{ matrix.wine && '-fwine' || '' }}

  test-extended:
    name: Godot ${{ matrix.godot }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot: "4.4"
            target: x86_64-linux
          - os: ubuntu-latest
            godot: "4.4"
            target: x86_64-windows
            wine: true
          - os: ubuntu-24.04-arm
            godot: "4.4"
            target: aarch64-linux
          - os: ubuntu-24.04-arm
            godot: "4.4"
            target: aarch64-windows
            wine: true
          - os: ubuntu-latest
            godot: "4.3"
            target: x86_64-linux
          - os: ubuntu-latest
            godot: "4.3"
            target: x86_64-windows
            wine: true
          - os: ubuntu-24.04-arm
            godot: "4.3"
            target: aarch64-linux
          - os: ubuntu-24.04-arm
            godot: "4.3"
            target: aarch64-windows
            wine: true
          - os: ubuntu-latest
            godot: "4.2"
            target: x86_64-linux
          - os: ubuntu-latest
            godot: "4.2"
            target: x86_64-windows
            wine: true
          - os: ubuntu-24.04-arm
            godot: "4.2"
            target: aarch64-linux
          - os: ubuntu-24.04-arm
            godot: "4.2"
            target: aarch64-windows
            wine: true
          - os: ubuntu-latest
            godot: "4.1"
            target: x86_64-linux
          - os: ubuntu-latest
            godot: "4.1"
            target: x86_64-windows
            wine: true
          - os: ubuntu-24.04-arm
            godot: "4.1"
            target: aarch64-linux
          - os: ubuntu-24.04-arm
            godot: "4.1"
            target: aarch64-windows
            wine: true
          - os: macos-latest
            godot: "4.5"
            target: aarch64-macos

    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - name: Install Wine (x86_64)
        if: matrix.wine && matrix.os == 'ubuntu-latest'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64
      - name: Install Wine (aarch64)
        if: matrix.wine && matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y wine
      - name: Run tests
        run: zig build test -Dgodot-version=${{ matrix.godot }} -Dtarget=${{ matrix.target }} ${{ matrix.wine && '-fwine' || '' }}
