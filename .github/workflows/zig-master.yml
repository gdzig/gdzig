name: Zig Master (experimental)

# Non-blocking signal for zig master (0.17.x dev): surfaces upstream
# breakage as it happens, so the eventual 0.17.0 migration is a formality.
# Nightly + manual dispatch only — never gates PRs or master pushes.
# The supported toolchain stays pinned in mise.toml / build.zig.zon.
# Tracked under gdzig/gdzig#245.

on:
  # TEMPORARY (pre-merge validation only — remove before merging):
  # lets this nightly workflow run once on PR #252 to measure the wasm
  # build duration in CI before it becomes schedule-only.
  pull_request:
  schedule:
    - cron: "23 4 * * *" # daily, off-peak
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig-master:
    name: zig master on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Experimental: failures do not mark the workflow as failed.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig (master)
        uses: mlugg/setup-zig@v2
        with:
          version: master
          cache-key: zig-master

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.2"
          use-dotnet: false

      - name: Build
        run: zig build

      - name: Test
        run: zig build test -Dgodot-path="$(command -v godot)"

      # The wasm32-emscripten debug_io workaround (gdzig/gdzig#244) must turn
      # itself off on master and the web build must pass without it (#245).
      - name: Build example for wasm32-emscripten
        run: zig build -Dtarget=wasm32-emscripten
        working-directory: example
